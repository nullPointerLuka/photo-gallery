<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Galería de fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galería de fotos</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Cuadrícula con las fotos guardadas (2 por fila en pantallas pequeñas) -->
  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos; track photo.filepath) {
        <ion-col size="6">
          <ion-img [src]="photo.webviewPath"></ion-img>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- Botón flotante que abre la cámara -->
  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()" aria-label="Tomar foto">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
